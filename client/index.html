<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DC島</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- 頂部 HUD（FFXIV 風） -->
  <div id="topbar">
    <div class="tb-left">
      <span class="tb-title">DC島</span>
      <span class="tb-sub" id="verTag">—</span>
      <span class="tb-time" id="gameClock">—</span>
    </div>
    <div class="tb-center" id="terrainChips"></div>
    <div class="tb-right">
      <div id="settingsBox">
        <button id="btnSettings" class="ff-btn" title="設定">
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
        </button>
        <!-- 設定選單：之後的設定項目加在這裡（.settings-item） -->
        <div id="settingsMenu" class="hidden">
          <button id="menuHelp" class="settings-item">操作說明</button>
<button id="menuNick" class="settings-item">暱稱設定</button>
<button id="menuLv" class="settings-item">名牌等級：顯示</button>
<button id="menuHp" class="settings-item">血量條：顯示</button>
<button id="menuXp" class="settings-item">經驗條：顯示</button>
        </div>
      </div>
      <button id="btnDex" class="ff-btn">圖鑑</button>
      <button id="btnAvatar" class="ff-btn">角色</button>
      <button id="btnDecor" class="ff-btn" style="display:none">裝飾模式</button>
    </div>
  </div>

  <canvas id="game" width="928" height="544"></canvas>

  <!-- 裝飾面板：左下，FFXIV housing 感 -->
  <div id="furnPanel" class="ff-panel hidden">
    <div class="ff-tabs"><button id="tabFurn" class="ff-btn small active">擺設</button><button id="tabFloor" class="ff-btn small">地板</button></div>
    <div id="furnHint" class="ff-panel-hint">左鍵放置／右鍵移除 · 按「完成」才會保存 · E／Esc 離開</div>
    <div id="furnDirty" class="ff-panel-hint dirty hidden"></div>
    <div id="furnList"></div>
    <div class="ff-panel-foot">
      <button id="furnClose" class="ff-btn small">完成</button>
      <button id="furnCancel" class="ff-btn small">取消變動</button>
      <button id="furnClear" class="ff-btn small warn">清空</button>
    </div>
  </div>

  <!-- 離開裝飾模式時，有未保存的變動就問 -->
  <div id="confirmBox" class="ff-panel hidden">
    <div class="ff-panel-title">尚未保存的變動</div>
    <div id="confirmMsg" class="ff-panel-hint"></div>
    <div class="ff-panel-foot">
      <button id="cfSave" class="ff-btn small">保存</button>
      <button id="cfDiscard" class="ff-btn small warn">不保存</button>
      <button id="cfKeep" class="ff-btn small">繼續編輯</button>
    </div>
  </div>

  <!-- 角色面板（2026-11-09 由「造型」改名） -->
  <div id="avatarPanel" class="ff-panel hidden">
    <div class="ff-panel-title">角色設定</div>
    <div id="avTabs" class="ff-tabs">
      <button class="ff-btn small avtab active" data-avtab="1">角色</button>
      <button class="ff-btn small avtab" data-avtab="2">外貌</button>
    </div>
    <div id="avPage1">
      <div class="grp"><label>等級</label><div id="lvRow"><span id="lvCur"></span><div id="lvBar"><span id="lvFill"></span></div></div></div>
      <div class="grp"><label>職業</label><div id="jobOpts"></div></div>
      <div class="grp"><label>稱號</label><div class="title-cur"><span id="titleCur"></span><button id="btnTitles" class="ff-btn small">稱號設定</button></div></div>
      <div class="grp"><label>裝備與外觀</label><div id="gearRows"></div></div>
    </div>
    <div id="avPage2" class="hidden">
      <!-- 外貌（2026-11-09 重新設計）：樣式一律是一排文字鈕、膚色是一排色塊；髮色／眼睛顏色是髮型／眼神後面的「換色」鈕（跟裝備一樣開選色視窗） -->
      <div class="grp"><label>種族</label><div id="raceOpts" class="look-row"></div></div>
      <div class="grp"><label>性別</label><div id="genderOpts" class="look-row"></div></div>
      <div class="grp"><label>膚色</label><div id="skinOpts" class="look-row"></div></div>
      <div class="grp"><label>髮型</label><div id="hairOpts" class="look-row"></div></div>
      <div class="grp"><label>臉型</label><div id="faceOpts" class="look-row"></div></div>
      <div class="grp"><label>眼神</label><div id="eyesOpts" class="look-row"></div></div>
    </div>
    <div class="ff-panel-foot"><button id="avatarClose" class="ff-btn small">完成</button></div>
  </div>

  <!-- 外觀一覽（角色設定的「外觀」鈕）：某部位可用的外觀 -->
  <div id="glamBox" class="ff-panel hidden">
    <div id="glamTitle" class="ff-panel-title">外觀</div>
    <div id="glamHint" class="ff-panel-hint"></div>
    <div id="glamList"></div>
    <div class="ff-panel-foot"><button id="glamClose" class="ff-btn small">關閉</button></div>
  </div>

  <!-- 選色視窗（角色設定的換色） -->
  <div id="colorBox" class="ff-panel hidden">
    <div id="colorTitle" class="ff-panel-title">換色</div>
    <canvas id="colorSV" width="200" height="120"></canvas>
    <canvas id="colorHue" width="200" height="14"></canvas>
    <div class="color-hexrow"><span id="colorNow"></span><input id="colorHex" maxlength="7" spellcheck="false"></div>
    <div id="colorPresets"></div>
    <div class="ff-panel-foot"><button id="colorReset" class="ff-btn small">原色</button><button id="colorCancel" class="ff-btn small">取消</button><button id="colorOk" class="ff-btn small">確定</button></div>
  </div>

  <!-- 嚮導的簡易操作說明 -->
  <div id="helpBox" class="ff-panel hidden">
    <div id="helpTitle" class="ff-panel-title"></div>
    <div id="helpBody"></div>
    <div class="ff-panel-foot"><button id="helpClose" class="ff-btn small">知道了</button></div>
  </div>

  <!-- 線上列表（L） -->
  <div id="listBox" class="ff-panel hidden">
    <div class="ff-panel-title">線上列表</div>
    <div id="listHint" class="ff-panel-hint"></div>
    <div id="listBody"></div>
    <div class="ff-panel-foot"><button id="listClose" class="ff-btn small">關閉</button></div>
  </div>

  <!-- 魚類圖鑑：每個地形一頁，沒釣過的是剪影 -->
  <div id="dexBox" class="ff-panel hidden">
    <div class="ff-panel-title">圖鑑</div>
    <div id="dexMainTabs" class="ff-tabs"></div>
    <div id="dexFish">
      <div id="dexTabs" class="ff-tabs"></div>
      <div id="dexHint" class="ff-panel-hint"></div>
      <div id="dexGrid"></div>
    </div>
    <div id="dexCraft" class="hidden">
      <div id="craftTabs" class="ff-tabs hidden"></div>
      <div id="craftHint" class="ff-panel-hint"></div>
      <div id="craftBody"></div>
    </div>
    <div class="ff-panel-foot"><button id="dexClose" class="ff-btn small">關閉</button></div>
  </div>

  <!-- 暱稱設定（設定 → 暱稱設定；Esc 關閉） -->
  <div id="nickBox" class="hidden"><div class="ff-panel nick-panel"><div class="ff-panel-title">暱稱設定</div><div id="nickHint" class="nick-hint"></div><input id="nickInput" type="text" maxlength="12" autocomplete="off" spellcheck="false"><div class="table-btns"><button id="nickSave" class="ff-btn">儲存</button><button id="nickReset" class="ff-btn small">恢復預設</button><button id="nickCancel" class="ff-btn small">取消</button></div></div></div>

  <!-- 和平島遊戲桌的遊戲畫面（全螢幕；Esc 離開） -->
  <div id="tableBox" class="hidden">
    <div class="ff-panel table-panel">
      <div class="table-head"><div id="tableTitle" class="ff-panel-title">遊戲桌</div><span class="table-head-btns"><button id="tableCharsBtn" class="ff-btn small hidden">角色介紹</button><button id="tableRulesBtn" class="ff-btn small hidden">規則說明</button><button id="tableClose" class="ff-btn small">離開（Esc）</button></span></div>
      <div id="tableBody"></div>
    </div>
    <div id="leaveBox" class="hidden"><div class="ff-panel leave-panel"><div class="leave-msg">遊戲進行中，確定要離開嗎？</div><div class="leave-sub">離開會中斷你的這一局（依該遊戲規則，可能放棄成績）。</div><div class="table-btns"><button id="leaveStay" class="ff-btn">繼續遊戲</button><button id="leaveGo" class="ff-btn small">確定離開</button></div></div></div>
    <div id="rulesBox" class="hidden"><div class="ff-panel rules-panel"><div class="table-head"><div id="rulesTitle" class="ff-panel-title">規則說明</div><button id="rulesClose" class="ff-btn small">關閉</button></div><div id="rulesBody"></div></div></div>
  </div>


  <!-- 稱號一覽：已解鎖的可以選，顯示在名字上方 -->
  <div id="titleBox" class="ff-panel hidden">
    <div class="ff-panel-title">稱號一覽</div>
    <div id="titleTabs" class="title-tabs"><button class="ff-btn small" data-tab="battle">戰鬥</button><button class="ff-btn small" data-tab="fishing">釣魚</button><button class="ff-btn small" data-tab="game">遊戲</button></div>
    <div id="titleHint" class="ff-panel-hint"></div>
    <div id="titleList"></div>
    <div class="ff-panel-foot"><button id="titleClose" class="ff-btn small">關閉</button></div>
  </div>

  <!-- 看板：所有人都看得到、都能改 -->
  <div id="signBox" class="ff-panel hidden">
    <div class="ff-panel-title">看板</div>
    <div class="ff-panel-hint">寫點什麼吧——同島的人都看得到，也都能修改</div>
    <textarea id="signText" maxlength="100" rows="4" spellcheck="false"></textarea>
    <div class="ff-panel-foot">
      <button id="signSave" class="ff-btn small">儲存</button>
      <button id="signCancel" class="ff-btn small">取消</button>
    </div>
  </div>

  <!-- 武器列：左上角，滑鼠滾輪切換目前拿的武器 -->
  <div id="weaponBar" class="hidden" title="滑鼠滾輪切換武器"></div>
  <!-- 增減益：武器列下方（餐飲區吃喝得到的效果；滑鼠移上去只顯示名稱） -->
  <div id="buffBar" class="hidden"></div>

  <!-- 職業技能列（R 鍵）：畫面底部正中間，冷卻時有順時針退去的暗色扇形與秒數 -->
  <!-- 技能列下方：血量條（血條＋數字）與經驗條；兩者可在右上「設定」各自開關 -->
  <div id="skillBar" class="hidden">
    <div id="skillSlots"></div>
    <div id="statBars">
      <div id="statHp" class="statbar"><i></i><span></span></div>
      <div id="statXp" class="statbar"><i></i><span></span></div>
    </div>
  </div>
  <!-- 疾走虛擬按鍵：點擊或按 Shift 切換跑步／步行 -->
  <div id="sprintBtn" title="疾走（點擊或按 Shift 切換）"><canvas id="sprintIcon" width="52" height="52"></canvas></div>

  <div id="toast" class="hidden"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
