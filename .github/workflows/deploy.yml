name: 部署到 Cloudflare

# 有人推版到 main → 自動部署（三個維護者都不用手動更新伺服器）
on:
  push:
    branches: [main]
    paths:                      # 只有會影響線上內容的改動才部署（改文件不部署）
      - "client/**"
      - "worker/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:            # 也可以在 GitHub 網頁上按按鈕手動觸發

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Wrangler 部署
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 寫入版本號（左上角顯示 commit 前 7 碼）
        run: |
          printf '{"commit": "%s"}' "${GITHUB_SHA::7}" > client/version.json
          cat client/version.json

      - name: 部署 Worker 與前端
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "wrangler 版本："
          npx --yes wrangler@4 --version
          echo "登入身分："
          npx --yes wrangler@4 whoami
          echo "開始部署："
          npx --yes wrangler@4 deploy
